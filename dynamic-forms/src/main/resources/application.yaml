spring:
  application:
    name: dynamic-forms
  datasource:
    url: jdbc:h2:file:./data/dynamic-forms;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: dev.moon5.dynamicforms
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

dynamic-forms:
  admin:
    login-id: admin
    password: moon5!
  ui:
    category-max-depth: 2
