<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Templates - Dynamic Forms</title>
	<link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
</head>
<body>

<div class="d-flex" style="min-height: 100vh;">
	<nav th:replace="~{admin/fragments/sidebar :: sidebar}"></nav>
	<main class="p-4 flex-grow-1">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h4 class="mb-0">Templates</h4>
			<a th:href="@{/admin/template/new}" class="btn btn-primary btn-sm">+ New Template</a>
		</div>

		<table class="table table-hover align-middle">
			<thead>
				<tr>
					<th>Name</th>
					<th>Category</th>
					<th style="width: 160px;"></th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="template : ${templates}">
					<td th:text="${template.name}"></td>
					<td th:text="${categoryNames.get(template.categoryId)}"></td>
					<td class="text-end">
						<a class="btn btn-outline-secondary btn-sm"
						   th:href="@{/admin/template/{id}/edit(id=${template.id})}">Edit</a>
						<form th:action="@{/admin/template/{id}/delete(id=${template.id})}"
							  method="post" class="d-inline"
							  onsubmit="return confirm('Delete this template?');">
							<button type="submit" class="btn btn-outline-danger btn-sm">Delete</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>
	</main>
</div>

</body>
</html>
