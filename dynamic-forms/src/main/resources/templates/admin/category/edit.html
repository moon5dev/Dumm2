<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Edit Category - Dynamic Forms</title>
	<link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
</head>
<body>

<div class="d-flex" style="min-height: 100vh;">
	<nav th:replace="~{admin/fragments/sidebar :: sidebar}"></nav>
	<main class="p-4 flex-grow-1" style="max-width: 480px;">
		<h4 class="mb-3">Edit Category</h4>

		<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

		<form th:action="@{/admin/category/{id}(id=${category.id})}" method="post">
			<div class="mb-3">
				<label class="form-label">Name</label>
				<input type="text" name="name" class="form-control" th:value="${category.name}" required autofocus>
			</div>
			<div class="mb-3">
				<label class="form-label">Order</label>
				<input type="number" name="sortOrder" class="form-control" th:value="${category.sortOrder}">
			</div>
			<button type="submit" class="btn btn-primary">Save</button>
			<a th:href="@{/admin/category}" class="btn btn-outline-secondary">Cancel</a>
		</form>
	</main>
</div>

</body>
</html>
