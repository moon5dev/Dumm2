<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>New Category - Dynamic Forms</title>
	<link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
</head>
<body>

<div class="d-flex" style="min-height: 100vh;">
	<nav th:replace="~{admin/fragments/sidebar :: sidebar}"></nav>
	<main class="p-4 flex-grow-1" style="max-width: 480px;">
		<h4 class="mb-3">New Category</h4>

		<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

		<form th:action="@{/admin/category}" method="post">
			<div class="mb-3">
				<label class="form-label">Parent Category</label>
				<select name="parentId" class="form-select">
					<option value="">(Top level)</option>
					<option th:each="category : ${categories}"
							th:value="${category.id}"
							th:selected="${category.id == parentId}"
							th:text="${'　'.repeat(category.depth) + category.name}"></option>
				</select>
			</div>
			<div class="mb-3">
				<label class="form-label">Name</label>
				<input type="text" name="name" class="form-control" required autofocus>
			</div>
			<div class="mb-3">
				<label class="form-label">Order</label>
				<input type="number" name="sortOrder" class="form-control" value="1">
			</div>
			<button type="submit" class="btn btn-primary">Save</button>
			<a th:href="@{/admin/category}" class="btn btn-outline-secondary">Cancel</a>
		</form>
	</main>
</div>

</body>
</html>
