<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Dynamic Forms</title>
	<link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
	<style>
		body {
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #f3f4f6;
		}
		.mode-card {
			width: 280px;
			padding: 40px 24px;
			text-align: center;
			text-decoration: none;
			color: inherit;
			border-radius: 12px;
			transition: transform 0.15s ease, box-shadow 0.15s ease;
		}
		.mode-card:hover {
			transform: translateY(-4px);
			box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
			color: inherit;
		}
	</style>
</head>
<body>

<div class="container">
	<h1 class="text-center mb-5">Dynamic Forms</h1>
	<div class="d-flex gap-4 justify-content-center">
		<a th:href="@{/workspace}" class="mode-card border bg-white">
			<h3>User Mode</h3>
			<p class="text-muted mb-0">Select a template, fill it in, and print</p>
		</a>
		<a th:href="@{/admin}" class="mode-card border bg-white">
			<h3>Admin Mode</h3>
			<p class="text-muted mb-0">Manage templates and categories</p>
		</a>
	</div>
</div>

</body>
</html>
