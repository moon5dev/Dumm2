<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Select Templates - Dynamic Forms</title>
	<link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
</head>
<body>

<div class="container py-4" style="max-width: 720px;">
	<h4 class="mb-3">Select Templates</h4>
	<p class="text-muted">Select one or more templates to fill in.</p>

	<form th:action="@{/workspace/view}" method="get">
		<div class="list-group mb-3">
			<label class="list-group-item" th:each="template : ${templates}">
				<input class="form-check-input me-2" type="checkbox"
					   name="templateId" th:value="${template.id}">
				<span th:text="${template.name}"></span>
				<span class="text-muted small ms-2"
					  th:text="'(' + ${categoryNames.get(template.categoryId)} + ')'"></span>
			</label>
		</div>
		<button type="submit" class="btn btn-primary">Start</button>
		<a th:href="@{/}" class="btn btn-outline-secondary">Cancel</a>
	</form>
</div>

</body>
</html>
