<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Fill In - Dynamic Forms</title>
	<link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/css/document.css}">
	<style>
		body { background: #e5e7eb; }
		.dc-toolbar {
			position: sticky;
			top: 12px;
			z-index: 10;
			display: flex;
			flex-wrap: wrap;
			gap: 6px;
			align-items: center;
			background: #fff;
			border: 1px solid #d1d5db;
			border-radius: 8px;
			padding: 8px 12px;
			margin: 12px auto;
			width: 210mm;
		}
		.dc-toolbar select, .dc-toolbar input[type=color] {
			height: 32px;
		}
	</style>
</head>
<body>

<div class="dc-toolbar dc-no-print">
	<button type="button" class="btn btn-sm btn-outline-secondary" data-cmd="bold"><b>B</b></button>
	<button type="button" class="btn btn-sm btn-outline-secondary" data-cmd="italic"><i>I</i></button>
	<button type="button" class="btn btn-sm btn-outline-secondary" data-cmd="underline"><u>U</u></button>
	<button type="button" class="btn btn-sm btn-outline-secondary" data-cmd="justifyLeft">
		<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
			<rect x="1" y="2" width="14" height="2"/>
			<rect x="1" y="7" width="14" height="2"/>
			<rect x="1" y="12" width="8" height="2"/>
		</svg>
	</button>
	<button type="button" class="btn btn-sm btn-outline-secondary" data-cmd="justifyCenter">
		<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
			<rect x="1" y="2" width="14" height="2"/>
			<rect x="1" y="7" width="14" height="2"/>
			<rect x="4" y="12" width="8" height="2"/>
		</svg>
	</button>
	<button type="button" class="btn btn-sm btn-outline-secondary" data-cmd="justifyRight">
		<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
			<rect x="1" y="2" width="14" height="2"/>
			<rect x="1" y="7" width="14" height="2"/>
			<rect x="7" y="12" width="8" height="2"/>
		</svg>
	</button>
	<select id="dcFontSize" class="form-select form-select-sm" style="width: 100px;">
		<option value="10">10px</option>
		<option value="12">12px</option>
		<option value="13">13px</option>
		<option value="16" selected>16px</option>
		<option value="18">18px</option>
		<option value="20">20px</option>
		<option value="24">24px</option>
		<option value="28">28px</option>
		<option value="32">32px</option>
	</select>
	<input type="color" id="dcFontColor" value="#111827">
	<a th:href="@{/}" class="btn btn-sm btn-outline-secondary ms-auto">Home</a>
	<button type="button" id="dcSaveDraftBtn" class="btn btn-sm btn-outline-primary"
			title="Saves this form's current state. Shared per template, not per person — reopening it (by anyone) shows whatever was saved last.">Save Current Form</button>
	<button type="button" id="dcPrintBtn" class="btn btn-sm btn-primary">Print / Save as PDF</button>
</div>

<div th:each="template : ${templates}" class="doc" contenteditable="false"
	 th:attr="data-template-id=${template.id}" th:utext="${template.contentHtml}"></div>

<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}" defer></script>
<script th:src="@{/js/workspace.js}" defer></script>
</body>
</html>
